<script>
/* === core/flags.js === */
// src/core/flags.js — F0-Core · Estado de progressão serializável (Game.flags).
//
// Decisões:
// - D-05: Game.flags tem 13 chaves fixas. chapter (1..5); step (0..3, nº de runas
//   ativadas na ordem certa); secret_records (int >= 0); final_choice
//   (null | 'restaurar' | 'destruir' | 'lumi'); o resto boolean. Defaults = início
//   do Cap. 1. Mapeia o MVP: step→step, hasKey→has_key_c1, obj→derivado via
//   indiceObjetivoCap1() (0 explorar, 1 runas, 2 chave, 3 portão, 4 chefe).
// - D-06: loadFlags() é tolerante e idempotente: ignora chaves desconhecidas, troca
//   valor inválido pelo default e nunca lança; retorna false só se a entrada não for
//   objeto (aí preserva as flags atuais). Booleans aceitam 0/1 (legado/JSON antigo).
//
// Uso (integrador F0): Game.resetFlags() no begin(); ler step/hasKey via
// Game.getFlag('step') / Game.getFlag('has_key_c1'); salvar via Game.serializeFlags().
// Sem DOM/canvas/áudio; seguro em browser concatenado e em node (smoke).
// Custo: só acessos O(1); nenhuma alocação por frame (serialize só no save).

var Game = (typeof Game !== 'undefined' && Game !== null) ? Game : {};

Game.FLAG_DEFAULTS = {
  chapter: 1,
  sign_read: false,
  runes_done: false,
  step: 0,
  has_key_c1: false,
  boss1_defeated: false,
  cat_found: false,
  secret_records: 0,
  frag_green: false,
  frag_blue: false,
  frag_red: false,
  darius_spared: false,
  final_choice: null
};

Game.FINAL_CHOICES_VALIDOS = ['restaurar', 'destruir', 'lumi'];

// Devolve um objeto novo com os defaults (nunca a referência interna).
Game.getDefaultFlags = function () {
  return {
    chapter: 1,
    sign_read: false,
    runes_done: false,
    step: 0,
    has_key_c1: false,
    boss1_defeated: false,
    cat_found: false,
    secret_records: 0,
    frag_green: false,
    frag_blue: false,
    frag_red: false,
    darius_spared: false,
    final_choice: null
  };
};

// Valida/coage um valor para uma chave conhecida. Retorna {ok, valor}.
Game._coerceFlag = function (nomeFlag, valorBruto) {
  var defaults = Game.FLAG_DEFAULTS;
  if (!Object.prototype.hasOwnProperty.call(defaults, nomeFlag)) {
    return { ok: false, valor: undefined };
  }
  if (nomeFlag === 'chapter') {
    var capitulo = Math.floor(Number(valorBruto));
    if (!isFinite(capitulo) || capitulo < 1 || capitulo > 5) {
      return { ok: false, valor: defaults.chapter };
    }
    return { ok: true, valor: capitulo };
  }
  if (nomeFlag === 'step') {
    var passo = Math.floor(Number(valorBruto));
    if (!isFinite(passo) || passo < 0 || passo > 3) {
      return { ok: false, valor: defaults.step };
    }
    return { ok: true, valor: passo };
  }
  if (nomeFlag === 'secret_records') {
    var registros = Math.floor(Number(valorBruto));
    if (!isFinite(registros) || registros < 0) {
      return { ok: false, valor: defaults.secret_records };
    }
    return { ok: true, valor: registros };
  }
  if (nomeFlag === 'final_choice') {
    if (valorBruto === null || valorBruto === undefined) {
      return { ok: true, valor: null };
    }
    if (Game.FINAL_CHOICES_VALIDOS.indexOf(valorBruto) !== -1) {
      return { ok: true, valor: valorBruto };
    }
    return { ok: false, valor: defaults.final_choice };
  }
  // Chaves booleanas restantes.
  if (valorBruto === true || valorBruto === 1) {
    return { ok: true, valor: true };
  }
  if (valorBruto === false || valorBruto === 0) {
    return { ok: true, valor: false };
  }
  return { ok: false, valor: defaults[nomeFlag] };
};

// Reseta para o início do Cap. 1. Idempotente: chamar 2x dá o mesmo resultado.
Game.resetFlags = function () {
  Game.flags = Game.getDefaultFlags();
  return Game.flags;
};

// Cópia JSON-segura só com as chaves conhecidas (para saveGame()).
Game.serializeFlags = function () {
  var atuais = (Game.flags && typeof Game.flags === 'object') ? Game.flags : {};
  var copia = Game.getDefaultFlags();
  for (var chave in copia) {
    if (Object.prototype.hasOwnProperty.call(atuais, chave)) {
      var convertido = Game._coerceFlag(chave, atuais[chave]);
      copia[chave] = convertido.ok ? convertido.valor : copia[chave];
    }
  }
  return copia;
};

// Substitui as flags a partir de um objeto (ex.: loadGame()). Chaves ausentes
// voltam ao default; desconhecidas são ignoradas. Retorna true/false.
Game.loadFlags = function (objetoBruto) {
  if (objetoBruto === null || typeof objetoBruto !== 'object' || Array.isArray(objetoBruto)) {
    return false;
  }
  var novas = Game.getDefaultFlags();
  for (var chave in novas) {
    if (Object.prototype.hasOwnProperty.call(objetoBruto, chave)) {
      var convertido = Game._coerceFlag(chave, objetoBruto[chave]);
      novas[chave] = convertido.ok ? convertido.valor : novas[chave];
    }
  }
  Game.flags = novas;
  return true;
};

// Atribui uma flag conhecida. Desconhecida/inválida → false sem efeito colateral.
Game.setFlag = function (nomeFlag, valorBruto) {
  if (!Object.prototype.hasOwnProperty.call(Game.FLAG_DEFAULTS, nomeFlag)) {
    return false;
  }
  var convertido = Game._coerceFlag(nomeFlag, valorBruto);
  if (!convertido.ok) {
    return false;
  }
  if (!Game.flags || typeof Game.flags !== 'object') {
    Game.flags = Game.getDefaultFlags();
  }
  Game.flags[nomeFlag] = convertido.valor;
  return true;
};

// Lê uma flag conhecida; desconhecida → undefined.
Game.getFlag = function (nomeFlag) {
  if (!Object.prototype.hasOwnProperty.call(Game.FLAG_DEFAULTS, nomeFlag)) {
    return undefined;
  }
  if (!Game.flags || typeof Game.flags !== 'object') {
    return Game.FLAG_DEFAULTS[nomeFlag];
  }
  return Game.flags[nomeFlag];
};

// Deriva o índice do OBJ[] do MVP (0..4) a partir das flags. Ponte p/ o HUD atual.
Game.indiceObjetivoCap1 = function (flagsOpcional) {
  var flagsAtuais = (flagsOpcional && typeof flagsOpcional === 'object')
    ? flagsOpcional
    : (Game.flags || Game.FLAG_DEFAULTS);
  if (flagsAtuais.boss1_defeated === true) {
    return 4;
  }
  if (flagsAtuais.has_key_c1 === true) {
    return 3;
  }
  if (flagsAtuais.runes_done === true || flagsAtuais.step >= 3) {
    return 2;
  }
  if (flagsAtuais.sign_read === true || flagsAtuais.step > 0) {
    return 1;
  }
  return 0;
};

if (!Game.flags || typeof Game.flags !== 'object') {
  Game.resetFlags();
}

;
/* === core/save.js === */
// src/core/save.js — F0-Core · Save/Load em slot único (localStorage + fallback).
//
// Decisões:
// - D-10: payload versionado {versao:1, salvoEm, mapa, jogador:{x,y,hp}, flags,
//   objetivo}; chave 'cristalAmanhecer.v1.<slot>'; slot default 'principal'.
//   Salva ao trocar de mapa (connectSaveToWorld() → World.onMapChanged) e ao pegar
//   item-chave (saveOnKeyItem()). A floresta é procedural determinística (seed=7),
//   então basta persistir o id do mapa + posição: os geradores atuais recriam o resto.
// - D-11: todo acesso a localStorage em try/catch com fallback em memória (aba
//   privada/headless); loadGame() valida TUDO antes de aplicar (nunca aplica parcial);
//   botão Continuar via setupContinueButton(botao, aoCarregar) com pointer events,
//   sem <form>. hp mínimo 1 ao carregar (nunca restaura morto).
//
// Uso (título): connectSaveToWorld(); setupContinueButton(el, function(){ st='play'; });
// API global: saveGame(slot?), loadGame(slot?), hasSave(slot?), saveOnMapChange(),
// saveOnKeyItem(), connectSaveToWorld(), setupContinueButton(), describeSave().

var SaveSystem = (typeof SaveSystem !== 'undefined' && SaveSystem !== null) ? SaveSystem : {};

SaveSystem.SAVE_VERSION = 1;
SaveSystem.DEFAULT_SLOT = 'principal';
SaveSystem.KEY_PREFIX = 'cristalAmanhecer.v1.';
SaveSystem.MAX_HP = 8;
SaveSystem._memoryFallback = (SaveSystem._memoryFallback && typeof SaveSystem._memoryFallback === 'object')
  ? SaveSystem._memoryFallback
  : {};

SaveSystem._slotName = function (slotBruto) {
  return (typeof slotBruto === 'string' && slotBruto.length > 0) ? slotBruto : SaveSystem.DEFAULT_SLOT;
};

SaveSystem._keyFor = function (slotBruto) {
  return SaveSystem.KEY_PREFIX + SaveSystem._slotName(slotBruto);
};

SaveSystem._storageGet = function (chave) {
  try {
    if (typeof localStorage !== 'undefined' && localStorage !== null) {
      var valorNativo = localStorage.getItem(chave);
      if (valorNativo !== null && valorNativo !== undefined) {
        return valorNativo;
      }
    }
  } catch (erroLeituraNativa) {
    // Cai para o fallback em memória.
  }
  var reserva = SaveSystem._memoryFallback[chave];
  return (typeof reserva === 'string') ? reserva : null;
};

SaveSystem._storageSet = function (chave, valorTexto) {
  var gravouNativo = false;
  try {
    if (typeof localStorage !== 'undefined' && localStorage !== null) {
      localStorage.setItem(chave, valorTexto);
      gravouNativo = true;
    }
  } catch (erroEscritaNativa) {
    gravouNativo = false;
  }
  if (!gravouNativo) {
    try {
      SaveSystem._memoryFallback[chave] = valorTexto;
    } catch (erroReserva) {
      return false;
    }
  }
  return true;
};

// Flags atuais: prefere Game.serializeFlags(); senão espelha o MVP (step/hasKey/obj).
SaveSystem._collectFlags = function () {
  var baseFlags = null;
  try {
    if (typeof Game !== 'undefined' && Game !== null) {
      if (typeof Game.serializeFlags === 'function') {
        return Game.serializeFlags();
      }
      if (Game.flags && typeof Game.flags === 'object') {
        return JSON.parse(JSON.stringify(Game.flags));
      }
      if (typeof Game.getDefaultFlags === 'function') {
        baseFlags = Game.getDefaultFlags();
      }
    }
  } catch (erroFlags) {
    baseFlags = null;
  }
  if (!baseFlags || typeof baseFlags !== 'object') {
    baseFlags = {
      chapter: 1, sign_read: false, runes_done: false, step: 0, has_key_c1: false,
      boss1_defeated: false, cat_found: false, secret_records: 0, frag_green: false,
      frag_blue: false, frag_red: false, darius_spared: false, final_choice: null
    };
  }
  try {
    if (typeof step !== 'undefined') {
      var passo = Math.floor(Number(step));
      baseFlags.step = (isFinite(passo) && passo >= 0 && passo <= 3) ? passo : 0;
      baseFlags.runes_done = baseFlags.step >= 3;
    }
    if (typeof hasKey !== 'undefined') {
      baseFlags.has_key_c1 = (hasKey === true);
    }
    if (typeof obj !== 'undefined' && Number(obj) >= 1) {
      baseFlags.sign_read = true;
    }
    if (typeof B !== 'undefined' && B !== null && B.end === 1) {
      baseFlags.boss1_defeated = true;
    }
  } catch (erroMvp) {
    // Espelho do MVP é best-effort; as flags base continuam válidas.
  }
  return baseFlags;
};

SaveSystem._collectMapId = function () {
  try {
    if (typeof World !== 'undefined' && World !== null && typeof World.getCurrentId === 'function') {
      var atual = World.getCurrentId();
      if (typeof atual === 'string' && atual.length > 0) {
        return atual;
      }
    }
  } catch (erroMundo) {
  }
  try {
    if (typeof inBoss !== 'undefined' && inBoss === true) {
      return 'arena';
    }
  } catch (erroArena) {
  }
  return 'floresta';
};

SaveSystem._collectPlayer = function () {
  var posicao = { x: 3 * 16, y: 16 * 16, hp: SaveSystem.MAX_HP };
  try {
    if (typeof P !== 'undefined' && P !== null) {
      if (isFinite(Number(P.x))) {
        posicao.x = Number(P.x);
      }
      if (isFinite(Number(P.y))) {
        posicao.y = Number(P.y);
      }
      var vida = Math.floor(Number(P.hp));
      posicao.hp = (isFinite(vida) && vida >= 1 && vida <= SaveSystem.MAX_HP) ? vida : SaveSystem.MAX_HP;
    }
  } catch (erroJogador) {
  }
  return posicao;
};

SaveSystem.collectSaveData = function () {
  var flagsCopia = SaveSystem._collectFlags();
  var objetivo = 0;
  try {
    if (typeof Game !== 'undefined' && Game !== null && typeof Game.indiceObjetivoCap1 === 'function') {
      objetivo = Game.indiceObjetivoCap1(flagsCopia);
    } else if (typeof obj !== 'undefined') {
      var bruto = Math.floor(Number(obj));
      objetivo = (isFinite(bruto) && bruto >= 0 && bruto <= 4) ? bruto : 0;
    }
  } catch (erroObjetivo) {
    objetivo = 0;
  }
  return {
    versao: SaveSystem.SAVE_VERSION,
    salvoEm: (typeof Date !== 'undefined' && Date !== null) ? Date.now() : 0,
    mapa: SaveSystem._collectMapId(),
    jogador: SaveSystem._collectPlayer(),
    flags: flagsCopia,
    objetivo: objetivo
  };
};

// Validação estrutural (a validação fina das flags é do Game.loadFlags).
SaveSystem.validateSaveData = function (dados) {
  if (!dados || typeof dados !== 'object' || Array.isArray(dados)) {
    return false;
  }
  if (dados.versao !== SaveSystem.SAVE_VERSION) {
    return false;
  }
  if (typeof dados.mapa !== 'string' || dados.mapa.length === 0) {
    return false;
  }
  if (!dados.jogador || typeof dados.jogador !== 'object') {
    return false;
  }
  if (!isFinite(Number(dados.jogador.x)) || !isFinite(Number(dados.jogador.y))) {
    return false;
  }
  var vida = Math.floor(Number(dados.jogador.hp));
  if (!isFinite(vida) || vida < 1 || vida > SaveSystem.MAX_HP) {
    return false;
  }
  if (!dados.flags || typeof dados.flags !== 'object' || Array.isArray(dados.flags)) {
    return false;
  }
  return true;
};

// Aplica dados já validados: flags → mapa (recria via World/MVP) → jogador.
SaveSystem.applySaveData = function (dados) {
  if (!SaveSystem.validateSaveData(dados)) {
    return false;
  }
  try {
    if (typeof Game !== 'undefined' && Game !== null) {
      if (typeof Game.loadFlags === 'function') {
        Game.loadFlags(dados.flags);
      } else {
        Game.flags = JSON.parse(JSON.stringify(dados.flags));
      }
    }
  } catch (erroFlags) {
    return false;
  }
  var mapaAplicado = false;
  try {
    if (typeof World !== 'undefined' && World !== null &&
        typeof World.gotoImmediate === 'function' && World.maps && World.maps[dados.mapa]) {
      mapaAplicado = World.gotoImmediate(dados.mapa) === true;
    }
  } catch (erroMundo) {
    mapaAplicado = false;
  }
  if (!mapaAplicado) {
    try {
      if (dados.mapa === 'arena' && typeof arena === 'function') {
        arena();
        mapaAplicado = true;
      } else if (typeof forest === 'function') {
        forest();
        mapaAplicado = true;
      }
    } catch (erroLegado) {
      mapaAplicado = false;
    }
  }
  try {
    if (typeof Game !== 'undefined' && Game !== null && Game.flags) {
      if (typeof step !== 'undefined') {
        step = Game.flags.step;
      }
    }
  } catch (erroPasso) {
  }
  try {
    if (typeof Game !== 'undefined' && Game !== null && Game.flags) {
      if (typeof hasKey !== 'undefined') {
        hasKey = (Game.flags.has_key_c1 === true);
      }
      if (typeof obj !== 'undefined') {
        if (typeof Game.indiceObjetivoCap1 === 'function') {
          obj = Game.indiceObjetivoCap1(Game.flags);
        } else if (isFinite(Number(dados.objetivo))) {
          obj = Math.max(0, Math.min(4, Math.floor(Number(dados.objetivo))));
        }
      }
    }
  } catch (erroMvp) {
  }
  try {
    if (typeof P !== 'undefined' && P !== null) {
      P.x = Number(dados.jogador.x);
      P.y = Number(dados.jogador.y);
      P.hp = Math.floor(Number(dados.jogador.hp));
      P.inv = 60;
      P.kx = 0;
      P.ky = 0;
    }
  } catch (erroPosicao) {
    return false;
  }
  return true;
};

SaveSystem.saveGame = function (slotBruto) {
  try {
    var dados = SaveSystem.collectSaveData();
    var texto = JSON.stringify(dados);
    return SaveSystem._storageSet(SaveSystem._keyFor(slotBruto), texto);
  } catch (erroSave) {
    return false;
  }
};

SaveSystem.loadGame = function (slotBruto) {
  var textoBruto = SaveSystem._storageGet(SaveSystem._keyFor(slotBruto));
  if (typeof textoBruto !== 'string' || textoBruto.length === 0) {
    return false;
  }
  var dados = null;
  try {
    dados = JSON.parse(textoBruto);
  } catch (erroParse) {
    return false;
  }
  return SaveSystem.applySaveData(dados);
};

SaveSystem.hasSave = function (slotBruto) {
  var textoBruto = SaveSystem._storageGet(SaveSystem._keyFor(slotBruto));
  if (typeof textoBruto !== 'string' || textoBruto.length === 0) {
    return false;
  }
  try {
    return SaveSystem.validateSaveData(JSON.parse(textoBruto));
  } catch (erroValidacao) {
    return false;
  }
};

// Resumo para a tela de título ("Continuar — Cap. X"). Null se não há save.
SaveSystem.describeSave = function (slotBruto) {
  var textoBruto = SaveSystem._storageGet(SaveSystem._keyFor(slotBruto));
  if (typeof textoBruto !== 'string' || textoBruto.length === 0) {
    return null;
  }
  try {
    var dados = JSON.parse(textoBruto);
    if (!SaveSystem.validateSaveData(dados)) {
      return null;
    }
    return {
      capitulo: (dados.flags && isFinite(Number(dados.flags.chapter))) ? Number(dados.flags.chapter) : 1,
      mapa: dados.mapa,
      salvoEm: dados.salvoEm,
      vida: dados.jogador.hp
    };
  } catch (erroResumo) {
    return null;
  }
};

// Chamado ao trocar de mapa (hook de World.onMapChanged). Salva no slot único.
SaveSystem.saveOnMapChange = function (idMapa, spawnId) {
  return SaveSystem.saveGame(SaveSystem.DEFAULT_SLOT);
};

// Chamado ao pegar item-chave (ex.: chave do Cap. 1). Salva no slot único.
SaveSystem.saveOnKeyItem = function (itemChave) {
  return SaveSystem.saveGame(SaveSystem.DEFAULT_SLOT);
};

// Liga o autosave à troca de mapa. Retorna false se World ainda não carregou
// (aí o integrador chama de novo após concatenar world.js).
SaveSystem.connectSaveToWorld = function () {
  try {
    if (typeof World === 'undefined' || World === null) {
      return false;
    }
    World.onMapChanged = function (idMapa, spawnId) {
      try {
        SaveSystem.saveOnMapChange(idMapa, spawnId);
      } catch (erroHook) {
        // Autosave nunca pode quebrar a troca de mapa.
      }
    };
    return true;
  } catch (erroConexao) {
    return false;
  }
};

// Botão Continuar: esconde sem save; com save, carrega e chama aoCarregar().
// Sem <form>; só pointer events. Retorna true se o botão foi ligado.
SaveSystem.setupContinueButton = function (botaoElemento, aoCarregar) {
  if (!botaoElemento) {
    return false;
  }
  var temSave = SaveSystem.hasSave(SaveSystem.DEFAULT_SLOT);
  try {
    botaoElemento.style.display = temSave ? '' : 'none';
  } catch (erroEstilo) {
    // Estilo é cosmético; segue para o listener.
  }
  try {
    botaoElemento.addEventListener('pointerdown', function (eventoClique) {
      try {
        if (eventoClique && typeof eventoClique.preventDefault === 'function') {
          eventoClique.preventDefault();
        }
      } catch (erroEvento) {
      }
      var carregou = SaveSystem.loadGame(SaveSystem.DEFAULT_SLOT);
      if (carregou && typeof aoCarregar === 'function') {
        try {
          aoCarregar();
        } catch (erroCallback) {
        }
      }
    });
  } catch (erroBotao) {
    return false;
  }
  return true;
};

try {
  SaveSystem.connectSaveToWorld();
} catch (erroAuto) {
  // World pode carregar depois; o integrador chama connectSaveToWorld().
}

function saveGame(slotBruto) {
  return SaveSystem.saveGame(slotBruto);
}

function loadGame(slotBruto) {
  return SaveSystem.loadGame(slotBruto);
}

function hasSave(slotBruto) {
  return SaveSystem.hasSave(slotBruto);
}

function saveOnMapChange(idMapa, spawnId) {
  return SaveSystem.saveOnMapChange(idMapa, spawnId);

// forest.js — F1-Content :: Floresta dos Sussurros (Cap. 1)
// Porte fiel do forest() do MVP (cristal-cap1.html) para MapDef, + novidades F1:
//   + chave escondida num arbusto (alternativa ao enigma; não o substitui)
//   + raízes negras decorativas animadas (overlay, não sólidas)
//   + 2º inimigo: morcego-de-raiz (mesma dificuldade do slime)
//   + pedra azul (marco que toca o diálogo de encontro da Lumi)
//
// COMPAT MVP (não mudar): LCG seed=7, corredores cl/ln idênticos, portão em
// (27,3), runas azul(10,10)/verde(14,6)/vermelha(20,12), 7 slimes com o mesmo
// algoritmo de spawn, inscrição, chave do enigma em (23,12), chefe 24HP.
// Dificuldade: slime 2HP/contato 1 dano; morcego igual, só que mais rápido e
// com telegraph >= 30f antes da investida. Hitboxes generosas (contato d<10).
//
// Propostas D-0X: nenhuma. Nenhuma mudança de lore nesta frente.

function lcgForestTiles() {
  const MW = 30, MH = 20;
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const M = [];
  for (let j = 0; j < MH; j++) {
    M[j] = [];
    for (let i = 0; i < MW; i++) M[j][i] = (i < 1 || j < 1 || i > MW - 2 || j > MH - 2 || rnd() < .2) ? "#" : ".";
  }
  const cl = (a, b, c, d) => { for (let j = b; j <= d; j++) for (let i = a; i <= c; i++) M[j][i] = "."; };
  const ln = (a, b, c, d) => { cl(Math.min(a, c), b, Math.max(a, c), b + 1); cl(c, Math.min(b, d), c + 1, Math.max(b, d) + 1); };
  cl(1, 13, 7, 18); ln(2, 16, 10, 10); ln(10, 10, 14, 6); ln(14, 6, 20, 12); ln(20, 12, 27, 4);
  M[3][27] = "G"; M[3][26] = "#"; M[3][28] = "#"; M[2][27] = "#";
  return { tiles: M.map((row) => row.join("")), nextSeed: seed, rndState: () => seed };
}

// Spawns dos 7 slimes: algoritmo idêntico ao MVP (usa a sequência do LCG
// após a geração do mapa; P inicial em (3,16) p/ o teste de distância).
function slimeSpawns(grid) {
  const T = 16;
  const MW = 30, MH = 20;
  const M = grid.map((row) => row.split(""));
  const P = { x: 3 * T, y: 16 * T };
  // Reexecuta o LCG até o estado pós-mapa para replicar a sequência do MVP.
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) { if (!(i < 1 || j < 1 || i > MW - 2 || j > MH - 2)) rnd(); }
  const blocked = (ex, ey) => {
    const s = 10;
    const solidAt = (px, py) => {
      const i = Math.floor(px / T), j = Math.floor(py / T);
      if (i < 0 || j < 0 || i >= MW || j >= MH) return true;
      const c = M[j][i];
      return c === "#" || c === "G";
    };
    for (const [ax, ay] of [[0, 0], [s, 0], [0, s], [s, s]]) if (solidAt(ex + ax, ey + ay)) return true;
    for (const o of [{ x: 4 * T, y: 14 * T }, { x: 10 * T, y: 10 * T }, { x: 14 * T, y: 6 * T }, { x: 20 * T, y: 12 * T }])
      if (ex < o.x + T && ex + s > o.x && ey < o.y + T && ey + s > o.y) return true;
    return false;
  };
  const out = [];
  for (let n = 0; n < 500 && out.length < 7; n++) {
    const i = 6 + Math.floor(rnd() * 22), j = 2 + Math.floor(rnd() * 16);
    const e = { x: i * T + 3, y: j * T + 3 };
    if (M[j][i] === "." && !blocked(e.x, e.y) && Math.hypot(e.x - P.x, e.y - P.y) > 90) out.push({ tx: i, ty: j });
  }
  return out;
}
